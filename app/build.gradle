plugins { id 'com.android.application' }

// Signature fixe de math_0235 : fournie par les secrets GitHub, jamais dans le code
def ksFile = System.getenv('KEYSTORE_FILE')
def certHash = System.getenv('CERT_SHA256') ?: ''

android {
    namespace 'be.math0235.noxscan'
    compileSdk 34
    defaultConfig {
        applicationId 'be.math0235.noxscan'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
        buildConfigField 'String', 'CERT_SHA256', "\"${certHash}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'waink'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
