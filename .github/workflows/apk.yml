name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Adresse du coffre-fort (variable WAINK_SERVER, pas de clé ici)
        env: { SRV: '${{ vars.WAINK_SERVER }}' }
        run: if [ -n "$SRV" ]; then sed -i "s#__WAINK_SERVER__#$SRV#" app/src/main/assets/index.html; fi
      - name: Signature de math_0235 (secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD)
        env:
          KS: '${{ secrets.KEYSTORE_BASE64 }}'
          PW: '${{ secrets.KEYSTORE_PASSWORD }}'
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "::error::Ajoute les secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/waink.jks"
          H=$(keytool -list -v -keystore "$RUNNER_TEMP/waink.jks" -alias waink -storepass "$PW" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr -d ' \r')
          echo "KEYSTORE_FILE=$RUNNER_TEMP/waink.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$H" >> "$GITHUB_ENV"
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk WAINK.apk && rm -f "$RUNNER_TEMP/waink.jks"
      - name: Publier l'APK (lien direct)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v1.${{ github.run_number }}" WAINK.apk --title "WAINK v1.${{ github.run_number }}" --notes "WAINK — fait par math_0235" --latest
