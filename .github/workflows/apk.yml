name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Clé Gemini (secret GEMINI_API_KEY, optionnel)
        env: { KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: if [ -n "$KEY" ]; then sed -i "s#__GEMINI_KEY__#$KEY#" app/src/main/assets/index.html; fi
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk WAINK.apk
      - uses: actions/upload-artifact@v4
        with: { name: WAINK-apk, path: WAINK.apk }
